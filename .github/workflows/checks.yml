name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Record runtime platform
        run: node -p "JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Regenerates the diagnostics fixtures. The generator exits non-zero if any
      # shareable projection leaks a private condition, and the diff guard below
      # catches a registry change that was not re-exported into the evidence.
      - run: pnpm demo:diagnostics
      - run: git diff --exit-code -- docs/evidence/diagnostics-fixtures.json
  contracts:
    name: Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge --version
      - run: forge fmt --check --root contracts
      - run: forge test --root contracts -vv
      - run: pnpm contracts:abi
      - run: git diff --exit-code -- src/lib/abi
