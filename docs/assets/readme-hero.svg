<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Converge — Different people. One shared plan.</title>
  <desc id="desc">A warm cream banner with six colored participant circles joining one brick-red shared plan. AI proposes, humans approve, smart contracts enforce.</desc>
  <rect width="1200" height="400" rx="28" fill="#f8f5ef"/>
  <rect x="1" y="1" width="1198" height="398" rx="27" fill="none" stroke="#e2d9cd" stroke-width="2"/>
