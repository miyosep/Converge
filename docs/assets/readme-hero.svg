  <text x="58" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-style="italic" fill="#a6403c">Different people. One shared plan.</text>
  <text x="59" y="258" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#646860">AI proposes. Humans approve. Smart contracts enforce.</text>
