[profile.default]
src = "src"
test = "test"
solc_version = "0.8.24"
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
allow_paths = ["../node_modules"]

[profile.v2]
optimizer = true
optimizer_runs = 200
out = "out-v2"
cache_path = "cache-v2"

[invariant]
runs = 64
depth = 50
fail_on_revert = true
